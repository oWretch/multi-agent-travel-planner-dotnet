name: multi-agent-travel-planner-dotnet
metadata:
  template: multi-agent-travel-planner-dotnet@0.1.0
hooks:
  # Register the deployed agents as external agents in the Foundry project so
  # their traces surface under Agents in the Foundry portal. Runs after deploy
  # so agent changes only need `azd deploy`, not a reprovision.
  postdeploy:
    posix:
      shell: sh
      run: ./scripts/register-foundry-agents.sh
      interactive: true
      continueOnError: true
    windows:
      shell: pwsh
      run: ./scripts/register-foundry-agents.ps1
      interactive: true
      continueOnError: true
services:
  web:
    project: ./src/MultiAgentTravelPlanner
    language: dotnet
    host: appservice
